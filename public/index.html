<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicErase - AI 图片擦除工具</title>
  <meta name="description" content="一键移除图片中的物体，AI 智能填充背景，无需专业技能">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>✨ MagicErase</h1>
      <p class="subtitle">AI 驱动的图片擦除工具 - 一键移除不需要的物体</p>
    </header>

    <!-- Main Editor -->
    <div class="editor-section">
      <div class="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="placeholder" class="placeholder">
          <div class="placeholder-content">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <h3>上传图片开始编辑</h3>
            <p>支持 JPG、PNG、WebP 格式，最大 10MB</p>
            <button class="btn btn-primary" onclick="document.getElementById('upload').click()">
              📤 选择图片
            </button>
            <p class="hint">或直接拖拽图片到此处</p>
          </div>
        </div>
        <div id="loading" class="loading-overlay">
          <div class="spinner"></div>
          <p>AI 正在处理中...</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls" id="controls" style="display: none;">
        <div class="control-group">
          <label>画笔大小</label>
          <input type="range" id="brushSize" min="5" max="100" value="30">
          <span id="brushSizeValue">30px</span>
        </div>

        <div class="button-group">
          <button class="btn btn-secondary" id="clearMask">
            🗑️ 清除涂抹
          </button>
          <button class="btn btn-secondary" id="undo">
            ↩️ 撤销
          </button>
          <button class="btn btn-primary" id="erase">
            🪄 开始擦除
          </button>
          <button class="btn btn-success" id="download" style="display: none;">
            📥 下载结果
          </button>
        </div>

        <div class="actions">
          <button class="btn btn-outline" id="newImage">
            🔄 处理新图片
          </button>
        </div>
      </div>
    </div>

    <!-- How It Works -->
    <section class="how-it-works">
      <h2>💡 如何使用</h2>
      <div class="steps">
        <div class="step">
          <div class="step-number">1</div>
          <h3>上传图片</h3>
          <p>选择或拖拽图片到编辑区</p>
        </div>
        <div class="step">
          <div class="step-number">2</div>
          <h3>涂抹标记</h3>
          <p>用画笔涂抹要移除的物体</p>
        </div>
        <div class="step">
          <div class="step-number">3</div>
          <h3>AI 擦除</h3>
          <p>点击按钮，AI 自动填充背景</p>
        </div>
        <div class="step">
          <div class="step-number">4</div>
          <h3>下载结果</h3>
          <p>保存处理后的图片</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>
        <a href="https://github.com/joshua-9919/magicerase" target="_blank">GitHub</a>
        · 
        <span>Powered by Cloudflare + Clipdrop API</span>
      </p>
    </footer>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="upload" accept="image/*" style="display: none;">

  <script src="app.js"></script>
</body>
</html>
